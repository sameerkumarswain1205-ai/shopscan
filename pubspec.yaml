name: shopscan
description: "ShopScan - Electrical Store Inventory & Billing System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  camera: ^0.11.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  intl: ^0.20.2
  csv: ^6.0.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/shop.db
